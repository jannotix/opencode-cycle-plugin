name: Publish certified release

on:
  workflow_dispatch:
    inputs:
      release_candidate_run_id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string
      version:
        description: Certified semantic version
        required: true
        default: 1.0.0
        type: string

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish immutable certified artifacts
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # registry-url is deliberately absent: it writes an _authToken template
      # into .npmrc, and a credential file is exactly what must not exist on
      # this path. The default registry is registry.npmjs.org and trusted
      # publishing mints its own short-lived credential.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Download the sealed candidate
        env:
          CANDIDATE_ARTIFACT: opencode-cycle-${{ inputs.version }}-release-candidate
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_candidate_run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT" --dir candidate
      - name: Verify candidate origin, contents and publication order
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_candidate_run_id }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .name)" = "Release candidate"
          revision="$(jq -r .revision candidate/release-manifest.json)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$revision"
          git checkout --detach "$revision"
          (cd candidate && sha256sum --check SHA256SUMS)
          bun scripts/release/publication-plan.ts --candidate candidate --version "$VERSION" --revision "$revision" --output candidate/publication-order.txt
      - name: Install the certified npm publisher
        run: npm install --global npm@12.0.2
      - name: Prove trusted publishing is the only available credential
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          for config in "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc" .npmrc; do
            if [ -f "$config" ] && grep -q '_authToken' "$config"; then
              echo "A static npm credential is configured in $config" >&2
              exit 1
            fi
          done
      - name: Publish native packages before the plugin
        shell: bash
        run: |
          while IFS= read -r archive; do
            npm publish "$archive" --access public
          done < candidate/publication-order.txt
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          revision="$(jq -r .revision candidate/release-manifest.json)"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            candidate/artifacts/* \
            candidate/certifications/*.json \
            "candidate/opencode-cycle-$VERSION.cdx.json" \
            candidate/release-manifest.json \
            candidate/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$revision" \
            --title "Cycle for OpenCode v$VERSION" \
            --generate-notes
