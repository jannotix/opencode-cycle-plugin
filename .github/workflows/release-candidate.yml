name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version
        required: true
        default: 1.0.0
        type: string

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.97.1

jobs:
  quality:
    name: ${{ matrix.platform }} release gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
          - platform: Linux x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy --component rustfmt
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify candidate version
        shell: bash
        run: test "$(bun -p "require('./packages/opencode-cycle/package.json').version")" = "${{ inputs.version }}"
      - name: Run complete gate
        run: bun run check

  native:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            binary: target/release/workflowd.exe
          - target: linux-x64
            runner: ubuntu-latest
            binary: target/release/workflowd
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Build native release binary
        run: cargo build -p workflowd --release --locked
      - name: Package native artifact
        run: bun scripts/release/package-native.ts --target ${{ matrix.target }} --binary ${{ matrix.binary }} --output candidate/native-${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: candidate/native-${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  plugin:
    name: Build plugin package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Package plugin
        run: bun scripts/release/package-plugin.ts --output candidate/plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-package
          path: candidate/plugin/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security:
    name: Security release gate
    needs: quality
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Rust security auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce vulnerability and license policy
        run: bun run audit && bun run licenses

  sbom:
    name: Generate release SBOM
    needs: [native, plugin, security]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: native-*
          path: candidate/packages
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: plugin-package
          path: candidate/packages
      - name: Generate CycloneDX 1.6 SBOM
        shell: bash
        run: |
          args=()
          while IFS= read -r -d '' path; do args+=(--artifact "$path"); done < <(find candidate/packages -type f -name '*.tgz' -print0 | sort -z)
          mkdir -p candidate/sbom
          bun scripts/release/sbom.ts "${args[@]}" --output candidate/sbom/opencode-cycle-${{ inputs.version }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sbom
          path: candidate/sbom/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Certify OpenCode Desktop ${{ matrix.platform }}
    needs: [native, plugin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            native: native-win32-x64
          - platform: linux-x64
            runner: ubuntu-latest
            native: native-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux Desktop runtime
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: plugin-package
          path: candidate/plugin
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ matrix.native }}
          path: candidate/native
      - name: Run real Desktop certification
        run: bun scripts/ci/desktop-certification.ts --platform ${{ matrix.platform }} --plugin-archive candidate/plugin --native-archive candidate/native --revision ${{ github.sha }} --output candidate/certification/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certification-${{ matrix.platform }}
          path: candidate/certification/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  scale:
    name: Scale and repeatability release gates
    needs: quality
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Certify repository larger than 500,000 files
        run: bun run test:scale:500k
      - name: Run critical suite twenty consecutive times
        run: bun run test:repeat-critical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scale-certification
          path: target/certification/*.json
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Seal release candidate
    needs: [desktop, sbom, scale]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: native-*
          path: candidate/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: plugin-package
          path: candidate/artifacts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-sbom
          path: candidate/artifacts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: certification-*
          path: candidate/certifications
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: scale-certification
          path: candidate/certifications/scale
      - name: Bind artifacts to certification evidence
        run: bun scripts/release/release-manifest.ts --artifacts-directory candidate/artifacts --certifications-directory candidate/certifications --revision ${{ github.sha }} --version ${{ inputs.version }} --output candidate/release-manifest.json
      - name: Generate release checksums
        run: bun scripts/release/checksums.ts --directory candidate --output candidate/SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: candidate/**/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-cycle-${{ inputs.version }}-release-candidate
          path: candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
