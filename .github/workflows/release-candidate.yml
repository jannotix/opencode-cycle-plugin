name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version
        required: true
        default: 1.0.0
        type: string

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  CANDIDATE_VERSION: ${{ inputs.version }}
  RUST_VERSION: 1.97.1

jobs:
  quality:
    name: ${{ matrix.platform }} release gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
          - platform: Linux x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy --component rustfmt
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify candidate version
        shell: bash
        run: bun scripts/release/validate-version.ts --version "$CANDIDATE_VERSION"
      - name: Run static source gate
        run: bun run check
      - name: Run Bun test suite
        run: bun test
      - name: Run Rust test suite
        run: cargo test --workspace --all-features

  native:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            binary: target/release/workflowd.exe
          - target: linux-x64
            runner: ubuntu-latest
            binary: target/release/workflowd
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Build native release binary
        run: cargo build -p workflowd --release --locked
      - name: Package native artifact
        run: bun scripts/release/package-native.ts --target ${{ matrix.target }} --binary ${{ matrix.binary }} --output candidate/native-${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: candidate/native-${{ matrix.target }}/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  plugin:
    name: Build plugin package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Package plugin
        run: bun scripts/release/package-plugin.ts --output candidate/plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-package
          path: candidate/plugin/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security:
    name: Security release gate
    needs: quality
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Rust security auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce vulnerability and license policy
        run: bun run audit && bun run licenses

  desktop:
    name: Certify OpenCode Desktop ${{ matrix.platform }}
    needs: [native, plugin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            native: native-win32-x64
          - platform: linux-x64
            runner: ubuntu-latest
            native: native-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux Desktop runtime
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: plugin-package
          path: candidate/plugin
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ matrix.native }}
          path: candidate/native
      - name: Run real Desktop certification
        run: bun scripts/ci/desktop-certification.ts --platform ${{ matrix.platform }} --plugin-archive candidate/plugin --native-archive candidate/native --revision ${{ github.sha }} --output candidate/certifications/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certification-${{ matrix.platform }}
          path: candidate/certifications/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  scale:
    name: 500k scale release gate
    needs: quality
    runs-on: ubuntu-latest
    env:
      CYCLE_RELEASE_REVISION: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Certify repository larger than 500,000 files
        run: bun run test:scale:500k
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scale-certification
          path: target/certification/codebase-500k.json
          if-no-files-found: error
          retention-days: 14

  repeatability:
    name: Critical suite repeatability release gate
    needs: quality
    runs-on: ubuntu-latest
    env:
      CYCLE_RELEASE_REVISION: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run critical suite twenty consecutive times
        run: bun run test:repeat-critical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repeatability-certification
          path: target/certification/critical-suite.json
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Seal release candidate
    needs: [quality, security, plugin, native, desktop, repeatability, scale]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: native-*
          path: candidate/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: plugin-package
          path: candidate/artifacts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: certification-*
          path: candidate/certifications
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: scale-certification
          path: candidate/certifications
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: repeatability-certification
          path: candidate/certifications
      - name: Bind artifacts to certification evidence
        run: bun scripts/release/release-manifest.ts --artifacts-directory candidate/artifacts --certifications-directory candidate/certifications --revision ${{ github.sha }} --version "$CANDIDATE_VERSION" --output candidate/release-manifest.json
      - name: Generate CycloneDX 1.6 SBOM from the manifest allowlist
        run: bun scripts/release/sbom.ts --artifacts-directory candidate/artifacts --manifest candidate/release-manifest.json --output "candidate/opencode-cycle-$CANDIDATE_VERSION.cdx.json"
      - name: Generate release checksums
        run: bun scripts/release/checksums.ts --directory candidate --manifest candidate/release-manifest.json --output candidate/SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: candidate/artifacts/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-cycle-${{ inputs.version }}-release-candidate
          path: candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
