name: Compatibility audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: 1.97.1

jobs:
  toolchain:
    name: ${{ matrix.platform }} compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
          - platform: Linux x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy --component rustfmt
      - name: Verify pinned tools and OpenCode contract
        shell: bash
        run: |
          test "$(bun --version)" = "$BUN_VERSION"
          rustc --version | grep "rustc $RUST_VERSION"
          test "$(npm view @opencode-ai/plugin@1.18.16 version)" = "1.18.16"
          test "$(npm view typescript@7.0.2 version)" = "7.0.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run compatibility gate
        run: bun run check

  security:
    name: Dependency and license policy
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Rust security auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce vulnerability and license policy
        run: bun run audit && bun run licenses
